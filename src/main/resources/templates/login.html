<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Hotel Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
    <div class="login-card">
        <h1 class="login-title">Hotel Staff Portal</h1>
        <p class="login-subtitle">Staff Login Only (Admin & Receptionist)</p>

        <!-- Display error alert if any -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}">
            Invalid username or password
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="username">Staff Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       th:value="${username}" placeholder="Enter your staff username" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>
        
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
            Default Admin credentials: <code>admin</code> / <code>admin1234</code>
        </div>
    </div>
</body>
</html>
