<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management - Hotel Reservation System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Staff Members</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Manage hotel administrators, receptionists, and employees</p>
            </div>
            <a th:if="${session.loggedInStaff != null and session.loggedInStaff.staffType.name() == 'ADMIN'}"
               th:href="@{/staff/create}" class="btn btn-primary">+ Add New Staff</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="card">
            <form th:action="@{/staff}" method="get" class="search-bar">
                <input type="text" name="keyword" th:value="${keyword}"
                       class="search-input" placeholder="Search by name, NIC, or user ID...">
                <button type="submit" class="btn btn-primary">Search</button>
                <a th:if="${keyword != null and keyword != ''}" th:href="@{/staff}" class="btn btn-secondary">Clear</a>
            </form>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Position</th>
                            <th>Contact No</th>
                            <th>NIC</th>
                            <th>Username</th>
                            <th>Salary</th>
                            <th>Status</th>
                            <th th:if="${session.loggedInStaff != null and session.loggedInStaff.staffType.name() == 'ADMIN'}">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(staffList)}">
                            <td colspan="10" style="text-align: center; color: var(--text-muted); padding: 2rem;">
                                No staff members found.
                            </td>
                        </tr>
                        <tr th:each="staff : ${staffList}">
                            <td th:text="${staff.userId}"><strong>S001</strong></td>
                            <td th:text="${staff.name}">John Doe</td>
                            <td>
                                <span class="role-badge" th:text="${staff.staffType}">ADMIN</span>
                            </td>
                            <td th:text="${staff.position}">Manager</td>
                            <td th:text="${staff.contactNo}">0771234567</td>
                            <td th:text="${staff.nicOrPassport}">199012345678</td>
                            <td th:text="${staff.username != null ? staff.username : '-'}">admin</td>
                            <td th:text="${#numbers.formatDecimal(staff.salary, 1, 2)}">85000.00</td>
                            <td>
                                <span th:class="${staff.status.name() == 'ACTIVE' ? 'status-badge status-active' : 'status-badge status-inactive'}"
                                      th:text="${staff.status}">ACTIVE</span>
                            </td>
                            <td th:if="${session.loggedInStaff != null and session.loggedInStaff.staffType.name() == 'ADMIN'}">
                                <div style="display: flex; gap: 0.5rem;">
                                    <a th:href="@{'/staff/edit/' + ${staff.userId}}" class="btn btn-secondary btn-sm">Edit</a>
                                    <form th:action="@{'/staff/delete/' + ${staff.userId}}" method="post"
                                          onsubmit="return confirm('Are you sure you want to delete this staff member?');">
                                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
