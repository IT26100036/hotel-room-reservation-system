spring.application.name=hotel-room-reservation-system
server.port=8080

# File Storage Configuration
app.data.staff-file=data/staff.txt
app.data.staff-log-file=data/staff_log.txt

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.hotel=DEBUG
